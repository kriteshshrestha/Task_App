<!DOCTYPE html>
<html lang="en">
<head>

    <title>Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Todo List</h1>

    <input
        type="text"
        id="title"
        placeholder="Enter Task Title"
    >

    <br><br>

        type="text"
        id="description"
        placeholder="Enter Task Description"
    >

    <br><br>

    <button onclick="createTask()">
        Add Task
    </button>

    <hr>

    <div id="tasks">

        <!-- Tasks will be displayed here -->

            </div>

</html>
